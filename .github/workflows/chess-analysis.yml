
name: Chess PGN Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chess-pgn-analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-chess requests

      - name: Analyse PGN
        run: python scripts/analyse.py

      - name: Commit and push analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analysis/game-analysis.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add chess game analysis"
          git push
          
