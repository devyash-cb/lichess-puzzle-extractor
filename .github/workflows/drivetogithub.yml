name: Import Drive Zip to GitHub

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  import-and-unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Zip from Google Drive
        run: |
          # Using curl directly instead of gdown to bypass bot-blocking
          curl -L "https://drive.google.com/uc?export=download&id=1wVfsM3JIUw8NEN4OczAC7v3cV48iz7B0" -o downloaded_archive.zip

      - name: Create index folder and extract
        run: |
          mkdir -p index
          
          # Unzip the contents directly into the index folder
          unzip -o downloaded_archive.zip -d index
          
          # Remove the downloaded zip file
          rm downloaded_archive.zip

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Extracted Google Drive zip contents into index folder"
          commit_options: '--no-verify'
          
