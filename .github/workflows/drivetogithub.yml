name: Import Drive Zip to GitHub

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  import-and-unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Download Zip securely via Python
        run: |
          cat << 'EOF' > download.py
          import requests
          
          FILE_ID = '1wVfsM3JIUw8NEN4OczAC7v3cV48iz7B0'
          URL = 'https://drive.google.com/uc?export=download'
          
          print("Connecting to Google Drive...")
          session = requests.Session()
          response = session.get(URL, params={'id': FILE_ID}, stream=True)
          
          for key, value in session.cookies.items():
              if key.startswith('download_warning'):
                  print(f"Warning intercepted. Bypassing with token: {value}")
                  response = session.get(URL, params={'id': FILE_ID, 'confirm': value}, stream=True)
                  break
                  
          with open('downloaded_archive.zip', 'wb') as f:
              for chunk in response.iter_content(32768):
                  if chunk: f.write(chunk)
                  
          print("Download successful!")
          EOF
          
          python download.py
          rm download.py

      - name: Create index folder and extract
        run: |
          mkdir -p index
          unzip -o downloaded_archive.zip -d index
          rm downloaded_archive.zip

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Extracted Google Drive zip contents into index folder"
          commit_options: '--no-verify'
          
