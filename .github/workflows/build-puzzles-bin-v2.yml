name: Build Puzzles Bin V2

on:
  workflow_dispatch:

permissions:
  contents: write

# Prevent two manual runs from pushing to main at the same time.
concurrency:
  group: build-puzzles-bin-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade pip zstandard

      - name: Build puzzles.bin
        run: python puzzle_builder_v2.py

      - name: Commit and push generated database
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add puzzles.bin

          if git diff --cached --quiet; then
            echo "puzzles.bin has not changed; nothing to commit."
            exit 0
          fi

          git commit -m "Update generated puzzles.bin"

          # Retry synchronization/push in case main changes while the job runs.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main

            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "Rebase failed; stopping rather than overwriting remote history."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Successfully pushed puzzles.bin to main."
              exit 0
            fi

            echo "Push rejected; will fetch and retry."
            sleep 2
          done

          echo "Could not push after 3 attempts."
          exit 1
