name: Generate Lichess Puzzle Database

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zstandard

      - name: Download Lichess Puzzle Database (Streaming ZST)
        run: |
          wget -q https://database.lichess.org/lichess_db_puzzle.csv.zst -O lichess_db_puzzle.csv.zst

      - name: Process Puzzles
        run: |
          python process_puzzles.py

      - name: Package Binaries
        run: |
          # Compress the puzzle folders into your required zip format
          cd puzzlesbin
          zip -r ../puzzle123.zip ./*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3
          name: "Puzzle Binaries v3"
          files: puzzle123.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
